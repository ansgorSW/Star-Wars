<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Jeopardy - Netlify Edition</title>
    <style>
        :root {
            --bg: #050508;
            --card-bg: #11111d;
            --accent: #00d4ff;
            --sw-yellow: #ffe81f;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header { padding: 15px; text-align: center; }
        h1 { font-size: 1.8rem; color: var(--sw-yellow); margin: 0; letter-spacing: 5px; text-transform: uppercase; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 30px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .grid-container { flex-grow: 1; display: flex; justify-content: center; padding: 20px; min-height: 0; }
        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 40px repeat(5, 1fr);
            gap: 15px; width: 100%; max-width: 1400px; height: 100%;
        }

        .category-title {
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 0.8rem; color: var(--sw-yellow); font-weight: bold; text-transform: uppercase;
            border-bottom: 2px solid var(--sw-yellow);
        }

        .card {
            background: var(--card-bg); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: 900; border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; transition: 0.3s;
        }
        .card:hover:not(.used) { border-color: var(--accent); transform: scale(1.02); }
        .card.used { opacity: 0.1; cursor: default !important; pointer-events: none; }

        .scoreboard {
            height: 80px; background: #000; display: flex; justify-content: center; align-items: center; gap: 40px;
        }
        .player-box { padding: 10px 20px; border-radius: 8px; border: 2px solid transparent; text-align: center; min-width: 120px; }
        .player-box.active { border-color: var(--accent); background: rgba(0, 212, 255, 0.1); }

        #modal, #setupModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        #setupModal { display: flex; }
        .modal-content { max-width: 800px; width: 90%; text-align: center; position: relative; }

        #questionText { font-size: 2.2rem; margin-bottom: 2rem; font-weight: 300; line-height: 1.3; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: #161625; border: 1px solid #333; color: white; padding: 25px;
            border-radius: 10px; cursor: pointer; font-size: 1.3rem; transition: 0.2s;
        }
        .option-btn:hover { border-color: var(--accent); background: #1c1c2e; }
        .option-btn.correct { background: #2ecc71 !important; color: #000; font-weight: bold; }
        .option-btn.wrong { background: #e74c3c !important; color: white; }

        #aiLoader {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;
            color: var(--accent); font-size: 1.2rem;
        }

        .btn-main { background: var(--sw-yellow); color: #000; padding: 12px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        input { background: #111; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>

<div id="setupModal">
    <div class="modal-content">
        <h1 style="color: var(--sw-yellow);">Star Wars Jeopardy</h1>
        <p>1. OpenAI API-Key eingeben:</p>
        <input type="password" id="apiKey" placeholder="sk-..." style="width: 80%;"><br>
        <p>2. Spieleranzahl & Namen:</p>
        <input type="number" id="pCount" value="2" min="1" max="4" style="width: 60px;">
        <div id="pNames"></div>
        <br>
        <p>3. JSON-Datei laden:</p>
        <label class="btn-main" style="background: #333; color: white; cursor: pointer;">
            DATEI WÄHLEN <input type="file" id="fileInput" accept=".json" style="display:none">
        </label>
        <button class="btn-main" id="startBtn" onclick="startGame()" style="display:none; margin-left: 10px;">START</button>
    </div>
</div>

<header><h1>Star Wars Jeopardy</h1></header>
<div class="top-bar"><div id="turnInfo" style="color: var(--accent); font-weight: bold;"></div></div>

<div class="grid-container"><div id="gameBoard" class="grid"></div></div>
<div class="scoreboard" id="scoreboard"></div>

<div id="modal">
    <div id="aiLoader">DATEN AUS DEM HOLOCRON WERDEN GELADEN...</div>
    <div class="modal-content">
        <div id="questionText"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <button id="nextBtn" class="btn-main" style="display:none; margin-top: 40px;" onclick="nextTurn()">NÄCHSTER PILOT</button>
    </div>
</div>

<script>
    let allData = [];
    let players = [];
    let currentPlayer = 0;

    // Spieler-Setup Logik
    document.getElementById('pCount').addEventListener('change', (e) => {
        const div = document.getElementById('pNames');
        div.innerHTML = '';
        for(let i=0; i<e.target.value; i++) {
            div.innerHTML += `<input type="text" id="pn${i}" value="Pilot ${i+1}">`;
        }
    });
    document.getElementById('pCount').dispatchEvent(new Event('change'));

    // Dateiupload
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            allData = JSON.parse(ev.target.result);
            document.getElementById('startBtn').style.display = 'inline-block';
        };
        reader.readAsText(e.target.files[0]);
    });

    function startGame() {
        const count = document.getElementById('pCount').value;
        players = [];
        for(let i=0; i<count; i++) {
            players.push({ name: document.getElementById(`pn${i}`).value, score: 0 });
        }
        document.getElementById('setupModal').style.display = 'none';
        initBoard();
    }

    function initBoard() {
        const board = document.getElementById('gameBoard');
        board.innerHTML = '';
        const cats = allData.sort(() => 0.5 - Math.random()).slice(0, 5);
        
        cats.forEach(c => {
            const div = document.createElement('div');
            div.className = 'category-title';
            div.innerText = c.name;
            board.appendChild(div);
        });

        for(let i=0; i<5; i++) {
            cats.forEach(cat => {
                const val = (i+1) * 100;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span>CREDITS</span>${val}`;
                card.onclick = () => openQuestion(cat.questions[i], card, val);
                board.appendChild(card);
            });
        }
        updateUI();
    }

    async function openQuestion(q, card, val) {
        const modal = document.getElementById('modal');
        const loader = document.getElementById('aiLoader');
        const grid = document.getElementById('optionsGrid');
        document.getElementById('questionText').innerText = q.question;
        grid.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';
        modal.style.display = 'flex';
        loader.style.display = 'flex';

        const key = document.getElementById('apiKey').value.trim();
        let choices = [q.answer];

        try {
            const resp = await fetch(`https://api.openai.com/v1/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{
                        role: "system",
                        content: "Du bist ein Star Wars Experte. Erzeuge 3 falsche Antworten, die EXAKT zum Typ der richtigen Antwort passen. Antworte NUR mit den 3 Begriffen getrennt durch ein Semikolon (;)."
                    }, {
                        role: "user",
                        content: `Frage: "${q.question}", Richtige Antwort: "${q.answer}"`
                    }],
                    temperature: 0.6
                })
            });
            
            const data = await resp.json();
            if (data.choices && data.choices[0]) {
                const fakes = data.choices[0].message.content.split(';').map(s => s.trim());
                choices.push(...fakes);
            } else { throw new Error(); }
        } catch (e) {
            console.warn("API Fehler oder CORS Problem - Nutze Fallback");
            const fallback = allData.flatMap(c => c.questions.map(qu => qu.answer))
                            .filter(a => a !== q.answer)
                            .sort(() => 0.5 - Math.random()).slice(0, 3);
            choices.push(...fallback);
        }

        loader.style.display = 'none';

        choices.sort(() => 0.5 - Math.random()).slice(0, 4).forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = text;
            btn.onclick = () => {
                if(text === q.answer) {
                    btn.classList.add('correct');
                    players[currentPlayer].score += val;
                } else {
                    btn.classList.add('wrong');
                    Array.from(grid.children).forEach(b => {
                        if(b.innerText === q.answer) b.classList.add('correct');
                    });
                }
                Array.from(grid.children).forEach(b => b.style.pointerEvents = 'none');
                card.classList.add('used');
                document.getElementById('nextBtn').style.display = 'inline-block';
                updateUI();
            };
            grid.appendChild(btn);
        });
    }

    function updateUI() {
        document.getElementById('turnInfo').innerText = `PILOT AM STEUER: ${players[currentPlayer].name}`;
        const sb = document.getElementById('scoreboard');
        sb.innerHTML = '';
        players.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `player-box ${i === currentPlayer ? 'active' : ''}`;
            div.innerHTML = `<div style="font-size:0.7rem; opacity:0.6;">${p.name}</div><div style="font-size:1.5rem; color:var(--sw-yellow); font-weight:bold;">${p.score}</div>`;
            sb.appendChild(div);
        });
    }

    function nextTurn() {
        document.getElementById('modal').style.display = 'none';
        currentPlayer = (currentPlayer + 1) % players.length;
        updateUI();
    }
</script>
</body>
</html>
